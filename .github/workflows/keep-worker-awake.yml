name: Keep Render worker awake

# Render's free tier spins a Web Service down after 15 minutes with no
# inbound HTTP traffic — fine for the API (real users visiting the site
# count as traffic), but the Celery worker never receives HTTP traffic in
# normal operation (it only polls Redis), so nothing ever resets that
# clock on its own. See docs/checkpoints/phase-5.md.
#
# This pings the worker's own URL on a 10-minute schedule. BEST-EFFORT
# ONLY: GitHub does not guarantee scheduled runs on free repos, and this
# one was observed actually firing every 3-6 hours, not every 10 minutes
# (docs/checkpoints/phase-5.md, "Correction"). The real fix is the API
# waking the worker at ticket submission (app/core/worker_wake.py, needs
# WORKER_WAKE_URL set on the API service); this stays as a cheap backup.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping resolveiq-worker
        run: curl -sf -m 30 https://resolveiq-1-38lg.onrender.com/ && echo "worker responded OK"
