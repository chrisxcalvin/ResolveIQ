[project]
name = "resolveiq-backend"
version = "0.1.0"
description = "ResolveIQ FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pgvector>=0.3",
    "email-validator>=2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.2",
    "spacy>=3.8",
    "en-core-web-sm",
    "torch>=2.4",
    "unsloth>=2024.12",
    "langgraph>=0.2",
    "celery[redis]>=5.4",
    "groq>=0.13",
    "tenacity>=9.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
