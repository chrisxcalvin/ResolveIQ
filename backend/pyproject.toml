[project]
name = "resolveiq-backend"
version = "0.1.0"
description = "ResolveIQ FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pgvector>=0.3",
    "email-validator>=2.2",
    "scikit-learn>=1.5",
    "spacy>=3.8",
    "en-core-web-sm",
    "torch>=2.11",
    "unsloth>=2024.12",
    "langgraph>=0.2",
    "celery[redis]>=5.4",
    "groq>=0.13",
    "tenacity>=9.0",
    "slowapi>=0.1.10",
    "langfuse>=4.14.3",
    "ragas>=0.4.3",
    "langchain-community<0.4",
    "rapidfuzz>=3.14.5",
    "httpx>=0.27",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The test DB engine (tests/conftest.py) is a module-level singleton whose
# asyncpg connection pool binds to whichever event loop first touches it —
# reusing it from a second, function-scoped loop corrupts the connection.
# Pinning both to "session" keeps one event loop for the whole test run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
